<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>StepTok</title>

<style>
body {
  font-family: Arial, sans-serif;
  text-align: center;
  padding: 40px;
  background: linear-gradient(135deg, #667eea, #764ba2);
  color: white;
}

h1 {
  margin-bottom: 10px;
}

p {
  margin-bottom: 30px;
}

button {
  padding: 12px 25px;
  margin: 10px;
  font-size: 16px;
  cursor: pointer;
  border-radius: 8px;
  border: none;
  background-color: white;
  color: #333;
  font-weight: bold;
  transition: 0.3s;
}

button:hover {
  background-color: #ddd;
}

#preview {
  margin-top: 30px;
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
}

#preview img, #preview video {
  max-width: 250px;
  margin: 10px;
  border-radius: 10px;
  box-shadow: 0px 4px 15px rgba(0,0,0,0.3);
}
</style>

</head>
<body>

<h1>🎥 StepTok</h1>
<p>Nahraj fotku alebo video a zobrazí sa tu.</p>

<button id="uploadPhoto">Nahrať fotku</button>
<button id="uploadVideo">Nahrať video</button>

<div id="preview"></div>

<script>
const photoBtn = document.getElementById('uploadPhoto');
const videoBtn = document.getElementById('uploadVideo');
const preview = document.getElementById('preview');

photoBtn.addEventListener('click', () => {
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = 'image/*';
  input.onchange = e => {
    const file = e.target.files[0];
    const reader = new FileReader();
    reader.onload = () => {
      const img = document.createElement('img');
      img.src = reader.result;
      preview.appendChild(img);
    };
    reader.readAsDataURL(file);
  };
  input.click();
});

videoBtn.addEventListener('click', () => {
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = 'video/*';
  input.onchange = e => {
    const file = e.target.files[0];
    const reader = new FileReader();
    reader.onload = () => {
      const video = document.createElement('video');
      video.src = reader.result;
      video.controls = true;
      preview.appendChild(video);
    };
    reader.readAsDataURL(file);
  };
  input.click();
});
</script>

</body>
</html>
