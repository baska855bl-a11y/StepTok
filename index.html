<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>StepTok</title>

  <style>
    body {
      margin: 0;
      font-family: Arial;
      background: black;
      color: white;
      text-align: center;
    }

    h1 {
      margin-top: 20px;
    }

    .buttons {
      margin: 20px;
    }

    button {
      padding: 10px 20px;
      margin: 5px;
      font-size: 16px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }

    button:hover {
      opacity: 0.8;
    }

    .content {
      margin-top: 20px;
    }

    img, video {
      max-width: 90%;
      max-height: 70vh;
      border-radius: 10px;
    }
  </style>
</head>
<body>

<h1>StepTok</h1>
<p>Pozeraj fotku alebo video.</p>

<div class="buttons">
  <button onclick="showImage()">Zobraziť fotku</button>
  <button onclick="showVideo()">Zobraziť video</button>
</div>

<div class="content" id="contentArea"></div>

<script>
function showImage() {
  document.getElementById("contentArea").innerHTML =
    '<img src="https://picsum.photos/600/400" alt="Fotka">';
}

function showVideo() {
  document.getElementById("contentArea").innerHTML =
    '<video controls autoplay><source src="https://www.w3schools.com/html/mov_bbb.mp4" type="video/mp4"></video>';
}
</script>

</body>
</html>

<div id="feed" class="screen">
    <div class="video-container">
        <video class="video-player" src="video1.mp4" autoplay loop muted></video>
        <div class="video-info">
            <p>@username</p>
            <p>Popis videa...</p>
        </div>
        <div class="video-actions">
            <button>❤️</button>
            <button>💬</button>
            <button>🔄</button>
        </div>
    </div>
</div>
