<!DOCTYPE html>
<html lang="sk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StepTok - Prihlásenie</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background-color: #f1f1f1;
      color: #000;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .container {
      width: 100%;
      max-width: 400px;
      padding: 20px;
      background-color: rgba(255, 255, 255, 0.8);
      border-radius: 10px;
      box-shadow: 0px 4px 20px rgba(0, 0, 0, 0.2);
      text-align: center;
    }

    h2 {
      margin-bottom: 20px;
    }

    input {
      margin: 10px 0;
      padding: 10px;
      width: 100%;
      border-radius: 5px;
      border: 1px solid #ccc;
    }

    button {
      padding: 10px;
      width: 100%;
      border-radius: 5px;
      background-color: #007BFF;
      color: white;
      border: none;
      margin-top: 15px;
    }

    button:hover {
      background-color: #0056b3;
    }

    .alternative {
      margin-top: 10px;
    }

    .alternative a {
      color: #007BFF;
      text-decoration: none;
    }

    .alternative a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <!-- Kontajner pre prihlásenie -->
  <div class="container">
    <h2>Log in to StepTok</h2>

    <!-- Polia pre prihlásenie: používateľské meno, e-mail alebo telefón -->
    <input type="text" id="loginInput" placeholder="Username, Email or Phone" />
    <input type="password" id="passwordInput" placeholder="Password" />
    
    <!-- Tlačidlo na prihlásenie -->
    <button onclick="login()">Log In</button>
  </div>

  <script>
    // Funkcia na prihlásenie
    function login() {
      const loginValue = document.getElementById('loginInput').value;
      const password = document.getElementById('passwordInput').value;

      if (loginValue && password) {
        alert(`Successfully logged in with: ${loginValue}`);
      } else {
        alert("Please enter your username/email/phone and password!");
      }
    }
  </script>

</body>
</html>
