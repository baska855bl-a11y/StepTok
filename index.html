<!DOCTYPE html>
<html lang="sk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StepTok</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: black;
      color: white;
      overflow: hidden;
      text-align: center;
    }

    h1 {
      margin-top: 20px;
      font-size: 36px;
    }

    /* Hlavné menu */
    .menu {
      position: fixed;
      top: 10px;
      left: 50%;
      transform: translateX(-50%);
      background-color: rgba(0, 0, 0, 0.7);
      padding: 10px;
      border-radius: 10px;
      width: 80%;
      display: flex;
      justify-content: space-around;
      font-size: 18px;
      z-index: 10;
    }

    .menu button {
      background-color: transparent;
      border: 1px solid white;
      padding: 10px 20px;
      color: white;
      cursor: pointer;
    }

    .menu button:hover {
      opacity: 0.8;
    }

    /* Zobrazenie obsahu fotiek a videí */
    .content {
      margin-top: 100px;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 70vh;
      position: relative;
    }

    img, video {
      max-width: 90%;
      max-height: 100%;
      border-radius: 10px;
    }

    /* Akcie na médiu */
    .media-actions {
      position: absolute;
      bottom: 20px;
      left: 20px;
      color: white;
      display: flex;
      gap: 15px;
    }

    .media-actions button {
      background: rgba(0, 0, 0, 0.6);
      padding: 10px;
      border-radius: 5px;
      cursor: pointer;
    }

    /* Komentáre */
    .comments {
      position: absolute;
      bottom: 10px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0, 0, 0, 0.6);
      color: white;
      padding: 5px;
      max-width: 80%;
      border-radius: 10px;
    }

    .comments input {
      width: 80%;
      padding: 5px;
      margin: 5px 0;
      border: none;
      border-radius: 5px;
    }

    .comments button {
      padding: 5px;
      background-color: #4CAF50;
      color: white;
      border: none;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <h1>StepTok</h1>

  <!-- Hlavné menu -->
  <div class="menu">
    <button onclick="showFeed()">Domov</button>
    <button onclick="login()">Prihlásenie</button>
  </div>

  <!-- Zobrazenie médií -->
  <div id="contentArea" class="content"></div>

  <!-- Načítanie a zobrazenie médií -->
  <script>
    // Zoznam médií na zobrazenie (obrázky a videá)
    const mediaList = [
      { type: "image", src: "https://picsum.photos/600/400?random=1" },
      { type: "video", src: "https://www.w3schools.com/html/mov_bbb.mp4" },
      { type: "image", src: "https://picsum.photos/600/400?random=2" }
    ];

    let index = 0;
    const contentArea = document.getElementById("contentArea");

    // Funkcia na zobrazenie médií
    function showNextMedia() {
      contentArea.innerHTML = ""; // Vyčisti obsah
      const item = mediaList[index];

      const mediaContainer = document.createElement('div');
      mediaContainer.classList.add('media-container');
      
      if (item.type === "image") {
        const img = document.createElement("img");
        img.src = item.src;
        mediaContainer.appendChild(img);
      } else if (item.type === "video") {
        const video = document.createElement("video");
        video.src = item.src;
        video.autoplay = true;
        video.muted = true;
        video.playsInline = true;
        video.onended = showNextMedia; // Po skončení videa, prejdeme na ďalší obsah
        mediaContainer.appendChild(video);
      }

      // Akcie na médiu (lajk, komentár)
      const mediaActions = document.createElement("div");
      mediaActions.classList.add("media-actions");
      const likeButton = document.createElement("button");
      likeButton.textContent = "❤️ Lajk";
      mediaActions.appendChild(likeButton);

      const commentButton = document.createElement("button");
      commentButton.textContent = "💬 Komentovať";
      mediaActions.appendChild(commentButton);

      mediaContainer.appendChild(mediaActions);

      // Komentáre
      const commentSection = document.createElement("div");
      commentSection.classList.add("comments");
      const commentInput = document.createElement("input");
      commentInput.type = "text";
      commentInput.placeholder = "Pridaj komentár...";
      commentSection.appendChild(commentInput);

      const commentSubmit = document.createElement("button");
      commentSubmit.textContent = "Pridať komentár";
      commentSection.appendChild(commentSubmit);

      mediaContainer.appendChild(commentSection);
      contentArea.appendChild(mediaContainer);

      // Zobrazenie ďalšieho média
      index++;
      if (index >= mediaList.length) {
        index = 0; // Začne to opäť od začiatku
      }
    }

    // Zobraziť Feed
    function showFeed() {
      showNextMedia();
    }

    // Funkcia pre prihlasovanie (príklad)
    function login() {
      alert("Prihlásenie funguje! Tu môžeš pridať autentifikáciu.");
    }

    // Automatické prechádzanie médiami
    showFeed();
  </script>

</body>
</html>
