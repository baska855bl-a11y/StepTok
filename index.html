<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StepTok</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            text-align: center;
        }

        header {
            background: black;
            color: white;
            padding: 15px;
            font-size: 20px;
        }

        .content {
            padding: 20px;
        }

        button {
            padding: 10px 20px;
            margin: 10px;
            font-size: 16px;
            cursor: pointer;
        }
    </style>
</head>
<body>

<header>StepTok</header>

<div class="content">
    <h1>Vitaj na StepToku!</h1>
    <p>Tu budú používatelia pridávať fotky a videá.</p>

    <button onclick="alert('Pridanie fotky')">📷 Pridať fotku</button>
    <button onclick="alert('Pridanie videa')">🎥 Pridať video</button>
</div>

</body>
</html>
