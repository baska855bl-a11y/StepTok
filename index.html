<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StepTok</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #ff4d6d, #3a86ff);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px;
            font-family: Arial, sans-serif;
        }

        .wrapper {
            background: white;
            padding: 20px;
            border-radius: 20px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.25);
            max-width: 1200px;
            width: 100%;
        }

        .wrapper img {
            width: 100%;
            height: auto;
            display: block;
            border-radius: 15px;
        }

    </style>
</head>
<body>

    <div class="wrapper">
        <img src="A_promotional_Slovak-language_landing_page_for_St.png" alt="StepTok Landing Page">
    </div>

</body>
</html>
