<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Moja stránka - Video & Fotka</title>

  <style>
    body {
      font-family: Arial;
      text-align: center;
      background: #111;
      color: white;
      margin: 0;
      padding: 20px;
    }

    h1 {
      margin-bottom: 30px;
    }

    .box {
      margin: 20px auto;
      padding: 20px;
      background: #222;
      border-radius: 10px;
      max-width: 600px;
    }

    img, video {
      width: 100%;
      border-radius: 10px;
      margin-top: 10px;
    }

    input {
      margin-top: 10px;
    }
  </style>
</head>
<body>

<h1>Moja stránka</h1>

<div class="box">
  <h2>Pridaj fotku</h2>
  <input type="file" accept="image/*" onchange="loadImage(event)">
  <img id="imagePreview">
</div>

<div class="box">
  <h2>Pridaj video</h2>
  <input type="file" accept="video/*" onchange="loadVideo(event)">
  <video id="videoPreview" controls></video>
</div>

<script>
function loadImage(event) {
  const image = document.getElementById("imagePreview");
  image.src = URL.createObjectURL(event.target.files[0]);
}

function loadVideo(event) {
  const video = document.getElementById("videoPreview");
  video.src = URL.createObjectURL(event.target.files[0]);
}
</script>

</body>
</html>
